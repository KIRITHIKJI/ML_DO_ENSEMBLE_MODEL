# ============================================================================
# config.yaml - the ONE place where every path, date, threshold and seed lives.
# No script in this project should hard-code any of these values.
# Load it with:  from src.config import load_config  (or yaml.safe_load)
# ============================================================================

project:
  name: "DO Early Warning V2"
  description: "Early warning of low dissolved oxygen in US rivers (multimodal)"

# ---------------------------------------------------------------------------
# Paths. All relative to the project root; scripts are always run from there
# (e.g. python -m src.data.download).
# ---------------------------------------------------------------------------
paths:
  data_raw: "data/raw"
  water: "data/raw/water"           # USGS sensor readings (15-min, UTC)
  weather: "data/raw/weather"       # ERA5 via Open-Meteo (hourly, UTC)
  air: "data/raw/air"               # CAMS via Open-Meteo (hourly, UTC)
  stations: "data/raw/stations.csv" # one row per station we keep
  candidates: "data/raw/station_candidates.csv"  # stations we screened
  data_interim: "data/interim"
  data_processed: "data/processed"
  results: "results"
  reports: "reports"
  models: "models"
  data_report: "reports/data_report.md"
  # step 2 outputs
  hourly: "data/interim/hourly.parquet"            # cleaned hourly panel
  dropped_vars: "data/interim/dropped_variables.csv"
  train: "data/processed/train.parquet"
  val: "data/processed/val.parquet"
  test: "data/processed/test.parquet"
  feature_groups: "data/processed/feature_groups.json"
  features_report: "reports/features_report.md"

# Old project (A:\ML_MAIN). READ-ONLY: we only copy out of here, never write.
legacy:
  root: "A:/ML_MAIN/water-early-warning"
  raw_2023_2024: "A:/ML_MAIN/water-early-warning/data/raw"
  raw_2025: "A:/ML_MAIN/water-early-warning/data/raw_2025"

# ---------------------------------------------------------------------------
# Time period and the fixed chronological split.
# 2025 is the final hold-out: it must NOT influence any decision (tuning,
# feature choice, model selection) until the very last step.
# ---------------------------------------------------------------------------
period:
  start: "2023-01-01"
  end: "2025-12-31"

split:
  train_years: [2023]
  val_years: [2024]
  test_years: [2025]

# ---------------------------------------------------------------------------
# Target definition.
# Regression target: do_mgl. Classification: Low / Medium / Good.
#   Low    : DO <  5 mg/L
#   Medium : 5 <= DO <= 7 mg/L
#   Good   : DO >  7 mg/L
# ---------------------------------------------------------------------------
target:
  column: "do_mgl"
  thresholds:
    low: 5.0        # below this = Low
    good: 7.0       # above this = Good
  class_names: ["Low", "Medium", "Good"]

# Forecast horizons, in hours ahead.
horizons: [6, 12, 24, 48]

# A "low-DO event" starts when DO drops below `low` after at least
# `event_recovery_hours` of DO at or above it. Used by check_data.py.
event:
  recovery_hours: 24

# ---------------------------------------------------------------------------
# Reproducibility
# ---------------------------------------------------------------------------
seed: 42

# ---------------------------------------------------------------------------
# Data download settings (src/data/download.py)
# ---------------------------------------------------------------------------
download:
  target_stations: 30         # how many stations we want in total
  min_do_coverage: 0.80       # DO coverage required in EACH year
  max_new_candidates: 250     # how many new stations we are willing to screen
  candidates_per_state: 8     # how many candidates per state enter that list
  per_state_cap: 3            # at most this many NEW stations kept per state
  # The coverage rule is applied to the stations inherited from the old
  # project as well. A station whose DO sensor died (e.g. 8% coverage in 2025)
  # cannot be part of an honest 2025 test, so it is dropped and replaced.
  apply_rules_to_legacy: true
  retries: 4
  timeout: 120
  sleep_between_calls: 1.0    # be polite to the free Open-Meteo API

  # USGS instantaneous-value parameter codes -> our column names
  usgs_params:
    "00300": "do_mgl"           # dissolved oxygen, mg/L
    "00010": "water_temp_c"     # water temperature, degC
    "00095": "spec_cond_uscm"   # specific conductance, uS/cm at 25C
    "00400": "ph"               # pH
    "63680": "turbidity_fnu"    # turbidity, FNU
    "00060": "discharge_cfs"    # discharge / streamflow, ft3/s

  # A station is unusable without these three.
  required_params: ["00300", "00010", "00095"]

  # Searched in this order. Warm southern and urban rivers first: low-oxygen
  # episodes are far more common there.
  states: ["FL", "GA", "LA", "TX", "SC", "NC", "AL", "MS", "IL", "IN", "OH",
           "MD", "VA", "PA", "TN", "KY", "MO", "AR", "OK", "WI", "MN", "IA",
           "NJ", "NY", "DE", "WV", "CA", "AZ", "OR", "WA"]

  weather_vars: ["temperature_2m", "relative_humidity_2m", "precipitation",
                 "surface_pressure", "wind_speed_10m", "shortwave_radiation",
                 "soil_moisture_0_to_7cm", "et0_fao_evapotranspiration"]

  air_vars: ["pm10", "pm2_5", "carbon_monoxide", "nitrogen_dioxide",
             "sulphur_dioxide", "ozone", "aerosol_optical_depth", "dust"]

  urls:
    usgs_site: "https://waterservices.usgs.gov/nwis/site/"
    usgs_iv: "https://waterservices.usgs.gov/nwis/iv/"
    open_meteo_weather: "https://archive-api.open-meteo.com/v1/archive"
    open_meteo_air: "https://air-quality-api.open-meteo.com/v1/air-quality"

  user_agent: "do-early-warning-student-project/2.0"

# ---------------------------------------------------------------------------
# Cleaning settings (src/data/clean.py)
# ---------------------------------------------------------------------------
cleaning:
  resample_rule: "h"              # 15-min sensor readings -> hourly means, UTC

  # Physically impossible values are set to NaN. `min_exclusive: true` means
  # the value must be strictly greater than `min` (conductivity cannot be 0).
  # A missing `min`/`max` means "no bound on that side".
  valid_ranges:
    do_mgl:         {min: 0.0,   max: 20.0}
    water_temp_c:   {min: -1.0,  max: 40.0}
    spec_cond_uscm: {min: 0.0,   max: 50000.0, min_exclusive: true}
    ph:             {min: 3.0,   max: 11.0}
    turbidity_fnu:  {min: 0.0}
    # Negative discharge is REAL at tidal stations: the tide pushes water
    # upstream. `min: null` means no lower bound, so those hours are kept.
    discharge_cfs:  {min: null}

  # Obvious sensor spikes: an hourly jump bigger than `max_change` that
  # reverses within `reversal_hours` is a sensor artefact, not a real river.
  spike:
    columns: ["do_mgl"]
    max_change: 4.0               # mg/L from one hour to the next
    reversal_hours: 2

  # Only short gaps are filled, and only by carrying the LAST OBSERVED value
  # forward (never by interpolating between the two sides of a gap, which
  # would let a filled value at time t see the future). Longer gaps stay NaN,
  # so a model never trains on invented data.
  gap_fill_method: "ffill"
  max_gap_fill_hours: 3

  # A water variable that is more than this fraction missing at a station
  # (measured on the TRAIN years only, so 2024/2025 never affect the choice)
  # is dropped for that station: the column stays but is all-NaN.
  drop_variable_if_missing_above: 0.50

  # Suffix of the 0/1 columns recording where a value was missing BEFORE
  # any filling.
  mask_suffix: "_was_missing"

# ---------------------------------------------------------------------------
# Feature settings (src/features/build_features.py)
#
# Every feature at time t uses only data at times <= t, and is computed
# per station. No statistic is ever computed over the whole dataset.
# ---------------------------------------------------------------------------
features:
  water_vars: ["do_mgl", "water_temp_c", "spec_cond_uscm", "ph",
               "turbidity_fnu", "discharge_cfs"]
  water_lags: [1, 2, 3, 6, 12, 24, 48]          # hours
  water_roll_windows: [6, 24, 72]               # hours
  water_roll_stats: ["mean", "min", "max", "std"]
  water_diffs: [1, 6, 24]                       # change over N hours

  # DO-specific features
  do_swing_window: 24           # daily swing = 24 h max - 24 h min
  do_low_hours_window: 24       # hours with DO < Low in the last 24 h
  hours_since_low_cap: 720      # cap on "hours since DO was last < Low"
  do_saturation: true           # DO / solubility at the current water temp

  # Weather
  weather_lags: [1, 6, 24]
  weather_roll24_vars: ["temperature_2m", "shortwave_radiation",
                        "wind_speed_10m"]
  weather_roll24_window: 24
  precip_var: "precipitation"
  precip_sum_windows: [24, 72, 168]             # 1 day, 3 days, 1 week
  rain_threshold_mm: 1.0                        # "it rained" means > this
  hours_since_rain_cap: 720

  # Air quality
  air_roll_window: 24

  # Rolling windows are not full for the first hours of a station, so those
  # rows are dropped.
  warmup_hours: 72

# ---------------------------------------------------------------------------
# Model settings (src/models/baselines.py, src/models/train_ml.py)
#
# These are the STARTING settings, not tuned. Any tuning happens on the
# validation year (2024) only.
# ---------------------------------------------------------------------------
models:
  # Where trained models and validation predictions go
  dirs:
    ml_models: "models/ml"
    val_predictions: "results/val/predictions"
    val_importance: "results/val/importance"
    val_metrics: "results/val"
    val_plots: "results/val/plots"

  early_stopping_rounds: 50     # XGBoost / LightGBM, watched on validation
  max_rounds: 2000              # upper limit before early stopping kicks in
  top_importances: 20           # how many features to save per model

  random_forest:
    n_estimators: 300
    min_samples_leaf: 20
    max_features: 0.3
    max_samples: 0.5            # each tree sees half the rows: much faster
    n_jobs: -1
    classifier_class_weight: "balanced_subsample"

  xgboost:
    tree_method: "hist"
    learning_rate: 0.05
    max_depth: 8
    subsample: 0.8
    colsample_bytree: 0.7
    n_jobs: -1
    # NaNs are handled natively; classes are balanced with sample weights

  lightgbm:
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 50
    feature_fraction: 0.7
    bagging_fraction: 0.8
    bagging_freq: 1
    n_jobs: -1
    categorical_features: ["station_id"]
    classifier_class_weight: "balanced"


  # --- deep learning architectures (used by src/models/dl_models.py) ---
  bilstm:
    hidden_size: 64
    num_layers: 2
    bidirectional: true
    dropout: 0.2
    dense_size: 64
  cnn_lstm:
    conv_channels: [32, 64]
    kernel_size: 3
    pool_size: 2
    hidden_size: 64
    num_layers: 1
    dropout: 0.2
    dense_size: 64

# ---------------------------------------------------------------------------
# Pass criteria - FIXED BEFORE ANY RESULTS WERE SEEN.
#
# A model is only worth carrying into the ensemble if it beats the naive
# "DO will stay as it is" forecast. For the classifier it must also not be
# worse at spotting the Low class, which is the whole point of an early
# warning: a model with a better macro F1 but fewer Low hours caught is not
# an improvement for this problem.
#
# All criteria are measured on VALIDATION (2024). Test (2025) is untouched.
# ---------------------------------------------------------------------------
pass_criteria:
  regression:
    min_skill_vs_persistence: 0.0        # strictly greater than this
  classification:
    beat_persistence_on: "f1_macro"      # strictly greater than persistence
    not_worse_on: "recall_Low"           # at least as high as persistence
    recall_tolerance: 0.0                # no slack allowed
  min_horizons_passed: 3                 # out of the 4 horizons

# ---------------------------------------------------------------------------
# Deep-learning settings (src/models/sequences.py, dl_models.py, train_dl.py)
#
# One network per architecture does BOTH tasks and ALL horizons at once
# (multi-task): 4 regression outputs and 4 x 3 classification logits.
# ---------------------------------------------------------------------------
deep_learning:
  device: "auto"              # "auto" -> cuda when a GPU is there, else cpu
  mixed_precision: true       # torch.autocast + GradScaler, GPU only
  sequence_length: 48         # the last 48 hours, t-47 .. t
  station_embedding_dim: 8
  batch_size: 512
  learning_rate: 0.001
  max_epochs: 30
  early_stopping_patience: 5  # epochs without a better validation loss
  lr_patience: 2              # ReduceLROnPlateau
  lr_factor: 0.5
  grad_clip: 1.0
  classification_loss_weight: 1.0   # loss = mse + this * cross_entropy
  num_workers: 0              # Windows: workers would be slower, not faster
  pin_memory: true
  max_minutes_per_epoch: 10   # stop and report if an epoch is slower than this

  # Defaults that the step-5 variants (dl_variants:) override.
  optimizer: "adam"               # "adam" or "adamw"
  weight_decay: 0.0               # AdamW only
  use_engineered_features: false  # the 211 step-2 features at time t
  feature_hidden: 64              # size of the dense layer that reads them

  # The raw hourly variables the sequences are built from. These are NOT the
  # 211 engineered features: a recurrent network is supposed to learn the
  # lags and rolling statistics itself.
  water_vars: ["do_mgl", "water_temp_c", "spec_cond_uscm", "ph",
               "turbidity_fnu", "discharge_cfs"]
  use_missing_flags: true     # the six <var>_was_missing columns
  use_do_saturation: true     # DO / solubility at the current water temp
  use_time_features: true     # hour and day-of-year as sin/cos

  dirs:
    dl_models: "models/dl"

# ---------------------------------------------------------------------------
# STEP 5 - tuning the deep models on validation (2024).
#
# Each variant is a set of overrides on top of `deep_learning:` and the
# architecture block. They are tried in the order listed, each one adding a
# change to the one before it, so the table in the report shows what each
# change was worth on its own.
#
#   step4                  the step-4 settings, re-run as the reference
#   reg                    (a) more dropout, AdamW with weight decay, lower
#                              learning rate, shorter patience
#   reg_hybrid             (b) + the 211 engineered features at time t
#   reg_hybrid_72h         (c) + a 72-hour window instead of 48
#   reg_hybrid_72h_small   (d) + hidden size 32 instead of 64
# ---------------------------------------------------------------------------
dl_search:
  variants: ["step4", "reg", "reg_hybrid", "reg_hybrid_72h",
             "reg_hybrid_72h_small"]
  results_csv: "results/val/dl_search.csv"
  archive_dir: "results/val/archive"
  # The chosen configuration is retrained with these seeds and the three
  # predictions are averaged.
  final_seeds: [42, 43, 44]
  # Picked by VALIDATION LOSS, the training objective itself, rather than by
  # any single metric - optimising directly on one metric is how you end up
  # with a model that is good at that metric and nothing else.
  select_by: "val_loss"

dl_variants:
  step4: {}                        # no overrides: exactly what step 4 ran

  reg:
    dropout: 0.3                   # also applied to the dense layer
    optimizer: "adamw"
    weight_decay: 0.0001
    learning_rate: 0.0005
    early_stopping_patience: 4

  reg_hybrid:
    dropout: 0.3
    optimizer: "adamw"
    weight_decay: 0.0001
    learning_rate: 0.0005
    early_stopping_patience: 4
    use_engineered_features: true  # the 211 step-2 features at time t
    feature_hidden: 64             # Linear(211 -> 64) + ReLU + dropout

  reg_hybrid_72h:
    dropout: 0.3
    optimizer: "adamw"
    weight_decay: 0.0001
    learning_rate: 0.0005
    early_stopping_patience: 4
    use_engineered_features: true
    feature_hidden: 64
    sequence_length: 72            # three days of history instead of two

  reg_hybrid_72h_small:
    dropout: 0.3
    optimizer: "adamw"
    weight_decay: 0.0001
    learning_rate: 0.0005
    early_stopping_patience: 4
    use_engineered_features: true
    feature_hidden: 64
    sequence_length: 72
    hidden_size: 32                # a smaller recurrent layer

# ---------------------------------------------------------------------------
# STEP 5b - one principled attempt at the deep models' classification.
#
# The validation year is split in two so that settings are not chosen and
# reported on the same rows:
#   val_a  first half of 2024  - choose the loss weight and the calibration
#   val_b  second half of 2024 - the numbers that get reported
# Early stopping still watches the loss on the WHOLE of 2024, exactly as in
# step 5, so this split changes what is tuned, not how training stops.
# Step 6 reuses these dates.
# ---------------------------------------------------------------------------
validation_split:
  val_a_start: "2024-01-01"
  val_a_end: "2024-06-30"
  val_b_start: "2024-07-01"
  val_b_end: "2024-12-31"

dl_cls_fix:
  base_variant: "reg_hybrid_72h_small"   # the architecture chosen in step 5
  # 1. how much louder to make the classification part of the loss
  cls_loss_weights: [2.0, 3.0]           # step 5 used 1.0
  # a heavier classification loss must not cost the regression side more
  # than this at any horizon
  max_rmse_worsening: 0.01               # 1%
  # 2. class-prior calibration: multiply the three probabilities by these
  # factors, renormalise, take argmax. Fitted on val_a only, per model and
  # per horizon.
  calibration_grid: [0.7, 0.85, 1.0, 1.15, 1.3]
  calibration_metric: "f1_macro"
  seeds: [42, 43, 44]
  archive_dir: "results/val/archive"
  results_csv: "results/val/dl_cls_fix.csv"

# ---------------------------------------------------------------------------
# STEP 6 - ATAE, the adaptive threshold-aware ensemble.
#
# Members are the five models that met the pre-registered rule in steps 3-5
# (a pass at 3 or more of the 4 horizons). `linear` and `persistence` stay
# as baselines to beat, not as members.
#
# Everything is tuned on val-A and reported on val-B (see validation_split:).
# Nothing is retrained in step 6; the ensemble only reads the predictions
# the members already wrote.
# ---------------------------------------------------------------------------
ensemble:
  members: ["random_forest", "xgboost", "lightgbm", "bilstm", "cnn_lstm"]
  baselines: ["persistence", "linear"]

  # a station needs at least this many KNOWN errors in the window before its
  # own history is trusted; below it, the all-station error is used
  min_known_errors: 24

  # the grid searched on val-A
  grid:
    alpha: [0, 2, 5, 10]          # how much extra weight near the threshold
    sigma: [0.5, 1.0]             # how wide "near the threshold" is, mg/L
    window_hours: [72, 168, 336]  # how far back "recently" goes
    temperature: [0.25, 0.5, 1.0] # how hard to back the current best model

  # The weighting used to SCORE candidates must not change with the alpha
  # being tried, or each candidate would be marked by its own exam.
  score_alpha: 5.0
  score_sigma: 1.0

  # the operational band for danger_zone_rmse, in mg/L
  danger_zone: [3.0, 7.0]

  # block bootstrap for the confidence intervals
  bootstrap:
    n_resamples: 1000
    block: "station_week"

  grid_results: "results/val/atae_grid_{task}.csv"
  chosen_file: "results/val/atae_chosen.json"
  weights_file: "results/val/atae_weights_{task}_h{h}.parquet"

# ---------------------------------------------------------------------------
# STEP 7 - blocked cross-fitting, the context-aware ensemble, warning rule.
# ---------------------------------------------------------------------------
crossfit:
  n_folds: 6
  months_per_fold: 2          # Jan-Feb, Mar-Apr, ... Nov-Dec
  # Dropped from the TRAINING side on both sides of the held-out fold, so a
  # 48 h target and the 336 h error window can never reach into it.
  purge_days: 14
  inner_holdout: 0.15         # time-ordered tail of the training folds,
                              # used only for early stopping

context_ensemble:
  # The meta-model is deliberately small: it has five strong members to
  # arbitrate between, not a new problem to solve from scratch, and the
  # easiest way to ruin an ensemble is to let its referee overfit.
  lightgbm:
    num_leaves: 15
    min_child_samples: 200
    learning_rate: 0.03
    feature_fraction: 0.8
    lambda_l2: 1.0
    n_estimators: 500
    early_stopping_rounds: 30
  # River context at time t, taken from data/processed (values at t only).
  context_features: ["do_mgl", "do_minus_threshold", "do_mgl_chg6",
                     "do_mgl_chg24", "do_swing24", "do_saturation",
                     "water_temp_c", "do_hours_since_low",
                     "hour_sin", "hour_cos", "doy_sin", "doy_cos"]
  # The error window for the "how has each member been doing lately"
  # features; matches the window ATAE chose in step 6.
  error_window_hours: 336
  # No station_id on purpose: the meta-model should learn situations, not
  # stations, so it can transfer to a period (and a station) it never saw.
  use_station_id: false
  model_dir: "models/ensemble"

warning_rule:
  # Argmax answers "which class is most likely". A warning system asks
  # "is the chance of Low high enough to act on", which is a different and
  # lower bar. tau is chosen on the training folds only.
  tau_grid_start: 0.05
  tau_grid_stop: 0.95
  tau_grid_step: 0.01
  max_false_alarm_rate: 0.02   # the budget: at most 2% false alarms
  fallback: "argmax"           # if no tau meets the budget

step7:
  methods: ["persistence", "linear", "random_forest", "xgboost", "lightgbm",
            "bilstm", "cnn_lstm", "simple_average", "stacking", "atae", "cae"]
  learned_methods: ["stacking", "atae", "cae"]
  bootstrap_against: ["stacking", "simple_average"]
  oof_predictions: "results/val/oof"
  results_dir: "results/val"

# Written by src/evaluation/step7_report.py from its pre-set decision rule.
final_system: "stacking"

# ---------------------------------------------------------------------------
# STEP 8 - the one and only evaluation on 2025.
#
# Everything here is decided and frozen BEFORE a single 2025 target is read.
# ---------------------------------------------------------------------------
final_test:
  # Step 7 found that a tau tuned to sit exactly on the 2% budget lands at
  # 2.3-2.5% out of sample, because the threshold that just fits on
  # five-sixths of a year will not quite fit on the rest. So the budget used
  # to CHOOSE tau is tightened by a safety margin, and the number the system
  # is judged against stays 2%.
  target_false_alarm_rate: 0.020      # what the system promises
  safety_margin: 0.002                # headroom taken off when choosing tau
  select_false_alarm_rate: 0.018      # = target - margin, the budget used

  thresholds_file: "models/ensemble/warning_thresholds.json"
  ablation_thresholds_file: "models/ensemble/ablation_thresholds.json"
  frozen_file: "FROZEN.md"

  stage2_dir: "models/stage2"          # members retrained on 2023+2024
  stage3_dir: "models/final"           # members retrained on all three years
  ablation_dir: "models/ablation"
  results_dir: "results/test"
  plots_dir: "results/test/plots"

  # The best single model, chosen on 2024 and frozen for the comparison.
  best_single:
    regression: "lightgbm"
    classification: "xgboost"

  # The input sets for the multimodal ablation (groups from
  # data/processed/feature_groups.json).
  ablation_sets:
    W: ["water", "time", "station"]
    W+M: ["water", "time", "station", "weather"]
    W+M+A: ["water", "time", "station", "weather", "air"]

  # A low-DO event starts when DO drops below the threshold after at least
  # this many hours at or above it; lead time is measured against that hour.
  event_recovery_hours: 24
  lead_time_window_hours: 24
